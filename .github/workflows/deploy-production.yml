name: Deploy Production

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy no VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            set -Eeuo pipefail

            cd /opt/nfsesaas/NfseSaaS

            # --------------------------------------------------
            # Arquivos do compose
            # --------------------------------------------------
            # docker-compose.segredos.yml (fora do git) guarda o
            # certificado que criptografa as chaves do Data Protection
            # — ver docs/operacao/protecao-chaves.md. Se existir, entra
            # em todos os comandos, inclusive no rollback.

            COMPOSE=(docker compose -f docker-compose.prod.yml)
            if [ -f docker-compose.segredos.yml ]; then
              COMPOSE+=(-f docker-compose.segredos.yml)
            fi
            echo "Compose: ${COMPOSE[*]}"

            echo "======================================"
            echo "INICIANDO DEPLOY"
            echo "======================================"

            # --------------------------------------------------
            # Guarda informações da versão atualmente em produção
            # --------------------------------------------------

            PREVIOUS_COMMIT=$(git rev-parse HEAD)

            # Nome da imagem do serviço "app" (o mesmo que o build gera).
            # Se o container atual tiver sido criado a partir de um ID
            # (sha256:...), usa o nome padrão do compose.
            APP_IMAGE_NAME=$(docker inspect \
              --format='{{.Config.Image}}' \
              nfsesaas-app 2>/dev/null || true)
            case "$APP_IMAGE_NAME" in
              ""|sha256:*) APP_IMAGE_NAME="nfsesaas-app" ;;
            esac

            # Guarda a imagem em produção com um NOME próprio ANTES do build.
            # Com o Docker 29 (armazenamento containerd), a imagem que perde
            # o nome no build some da lista e o "docker tag <sha256>" do
            # rollback antigo falhava com "No such image" (07/11/2026).
            ROLLBACK_IMAGE="nfsesaas-app:anterior"
            ROLLBACK_DISPONIVEL=0
            if docker image inspect "$APP_IMAGE_NAME" >/dev/null 2>&1; then
              docker tag "$APP_IMAGE_NAME" "$ROLLBACK_IMAGE"
              ROLLBACK_DISPONIVEL=1
            else
              echo "AVISO: imagem atual sem nome; o rollback de imagem não estará disponível neste deploy."
            fi

            echo "Commit atual : $PREVIOUS_COMMIT"
            echo "Nome imagem  : $APP_IMAGE_NAME"
            echo "Rollback     : $ROLLBACK_IMAGE (disponível: $ROLLBACK_DISPONIVEL)"


            # --------------------------------------------------
            # Função de rollback
            # --------------------------------------------------

            rollback() {

              EXIT_CODE=$?

              # Evita executar o trap novamente dentro do rollback
              trap - ERR

              echo ""
              echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
              echo "DEPLOY FALHOU"
              echo "INICIANDO ROLLBACK AUTOMÁTICO"
              echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"

              if [ "$ROLLBACK_DISPONIVEL" -ne 1 ]; then
                echo "Sem imagem anterior guardada: rollback de imagem impossível."
                echo "O container em produção não foi trocado se a falha veio antes de SUBINDO NOVA VERSÃO."
                docker ps
                exit "$EXIT_CODE"
              fi

              echo "Restaurando imagem anterior ($ROLLBACK_IMAGE)..."

              # Dentro do rollback nenhum erro pode interromper a tentativa
              # de voltar a versão anterior.
              set +e

              docker tag "$ROLLBACK_IMAGE" "$APP_IMAGE_NAME"

              "${COMPOSE[@]}" \
                up -d --no-build --force-recreate app

              echo "Aguardando versão anterior..."

              sleep 10

              echo "Testando versão restaurada..."

              ROLLBACK_OK=0

              for i in $(seq 1 12); do

                if curl \
                    --fail \
                    --silent \
                    --show-error \
                    --max-time 5 \
                    https://micoempresa.com.br/health
                then
                    ROLLBACK_OK=1
                    break
                fi

                echo "Tentativa $i/12..."
                sleep 5

              done

              echo ""

              if [ "$ROLLBACK_OK" -eq 1 ]; then

                echo "======================================"
                echo "ROLLBACK CONCLUÍDO COM SUCESSO"
                echo "Versão anterior restaurada."
                echo "Commit anterior: $PREVIOUS_COMMIT"
                echo "Migrations já aplicadas NÃO são desfeitas; backup do banco: ${BACKUP_FILE:-não criado}"
                echo "======================================"

              else

                echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
                echo "ATENÇÃO"
                echo "ROLLBACK TAMBÉM FALHOU"
                echo "Verificar servidor imediatamente."
                echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"

              fi

              docker ps

              exit "$EXIT_CODE"
            }


            trap rollback ERR


            # --------------------------------------------------
            # Backup PostgreSQL antes das migrations
            # --------------------------------------------------

            echo ""
            echo "======================================"
            echo "BACKUP DO BANCO"
            echo "======================================"

            mkdir -p /opt/nfsesaas/backups/postgres

            BACKUP_FILE="/opt/nfsesaas/backups/postgres/nfse_saas_$(date +%Y%m%d_%H%M%S).dump"

            docker exec nfsesaas-postgres \
              pg_dump \
              -U nfse \
              -d nfse_saas \
              -Fc \
              > "$BACKUP_FILE"

            echo "Backup criado:"
            echo "$BACKUP_FILE"


            # --------------------------------------------------
            # Atualizar código
            # --------------------------------------------------

            echo ""
            echo "======================================"
            echo "ATUALIZANDO CÓDIGO"
            echo "======================================"

            git fetch origin
            git checkout master
            git pull --ff-only origin master

            NEW_COMMIT=$(git rev-parse HEAD)

            echo "Nova versão:"
            echo "$NEW_COMMIT"

            # --------------------------------------------------
            # Versão exibida na tela "Sobre" (Administrador)
            # --------------------------------------------------
            # git describe usa a tag mais recente alcançável a partir do
            # commit atual (ex.: "v1.0.0" se for exatamente uma tag, ou
            # "v1.0.0-3-gabc1234" se houver 3 commits além dela). Sem
            # nenhuma tag ainda no repo, cai no --always (só o SHA curto)
            # — funciona desde já, e passa a mostrar a tag assim que
            # alguém rodar "git tag vX.Y.Z && git push --tags".
            export APP_VERSION=$(git describe --tags --always)
            export APP_COMMIT="$NEW_COMMIT"
            export APP_DEPLOY_EM=$(date -u +%FT%TZ)

            echo "Versão detectada: $APP_VERSION"


            # --------------------------------------------------
            # Build primeiro
            # --------------------------------------------------

            echo ""
            echo "======================================"
            echo "CONSTRUINDO NOVA IMAGEM"
            echo "======================================"

            "${COMPOSE[@]}" \
              build app


            # --------------------------------------------------
            # Migrations
            # --------------------------------------------------

            echo ""
            echo "======================================"
            echo "APLICANDO MIGRATIONS"
            echo "======================================"

            "${COMPOSE[@]}" \
              run --rm migrate


            # --------------------------------------------------
            # Subir nova aplicação
            # --------------------------------------------------
            # APP_VERSION/APP_COMMIT/APP_DEPLOY_EM (exportados acima)
            # só chegam dentro do container se docker-compose.prod.yml
            # referenciar ${APP_VERSION} etc. no "environment:" do
            # serviço "app" — ver instrução separada pra esse arquivo.

            echo ""
            echo "======================================"
            echo "SUBINDO NOVA VERSÃO"
            echo "======================================"

            "${COMPOSE[@]}" \
              up -d app


            # --------------------------------------------------
            # Health Check
            # --------------------------------------------------

            echo ""
            echo "======================================"
            echo "TESTANDO NOVA VERSÃO"
            echo "======================================"

            HEALTH_OK=0

            for i in $(seq 1 12); do

              if curl \
                  --fail \
                  --silent \
                  --show-error \
                  --max-time 5 \
                  https://micoempresa.com.br/health
              then

                  HEALTH_OK=1
                  break

              fi

              echo "Aplicação ainda não respondeu. Tentativa $i/12..."

              sleep 5

            done


            if [ "$HEALTH_OK" -ne 1 ]; then

              echo "Health check falhou."

              # Força o trap de rollback
              false

            fi


            # --------------------------------------------------
            # Deploy concluído
            # --------------------------------------------------

            trap - ERR

            # --------------------------------------------------
            # Limpeza dos backups pré-deploy
            # --------------------------------------------------
            # Mantém os 10 mais recentes. O backup diário completo
            # (deploy/backup) é que guarda o histórico longo.

            ls -1t /opt/nfsesaas/backups/postgres/nfse_saas_*.dump 2>/dev/null \
              | tail -n +11 \
              | xargs -r rm -f -- \
              || true

            echo "Backups pré-deploy guardados: $(ls -1 /opt/nfsesaas/backups/postgres/nfse_saas_*.dump 2>/dev/null | wc -l)"

            echo ""
            echo "======================================"
            echo "DEPLOY CONCLUÍDO COM SUCESSO"
            echo "======================================"

            echo "Commit anterior:"
            echo "$PREVIOUS_COMMIT"

            echo "Novo commit:"
            echo "$NEW_COMMIT"

            echo "Backup do banco:"
            echo "$BACKUP_FILE"

            echo ""

            docker ps